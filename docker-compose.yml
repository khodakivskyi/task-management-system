services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  db:
    image: postgres:17-alpine
    container_name: task-management-system-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:  ${DB_NAME}
    ports: 
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - task-network
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ============================================
  # Backend API
  # ============================================
  backend: 
    build: 
      context:  ./backend
      dockerfile: Dockerfile
    container_name: task-management-system-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    ports:
      - "${BACKEND_PORT:-5000}:8080"
      - "${BACKEND_HTTPS_PORT:-5001}:8081"
    depends_on:
      db: 
        condition: service_healthy
    networks:
      - task-network
    restart: unless-stopped

# ============================================
# Volumes
# ============================================
volumes:  
  postgres-data: 
    driver: local

# ============================================
# Networks
# ============================================
networks: 
  task-network:
    driver:  bridge