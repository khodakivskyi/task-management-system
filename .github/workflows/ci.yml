name: CI

on:  
  pull_request: 
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  backend-ci:
    runs-on:  ubuntu-latest

    steps: 
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with: 
        dotnet-version: 8.0.x 

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with: 
        distribution: 'zulu'
        java-version: '17'

    - name: Cache SonarCloud packages
      uses: actions/cache@v4
      with: 
        path:  ~/.sonar/cache
        key:  ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Install SonarCloud scanner
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Restore
      run: dotnet restore backend/backend.csproj

    - name: Format check
      run: dotnet format backend/backend.csproj --verify-no-changes

    - name: Begin SonarCloud analysis
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        dotnet-sonarscanner begin /k:"khodakivskyi_task-management-system" /o:"khodakivskyi" /d:sonar.token="$SONAR_TOKEN" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.sources="backend" /d:sonar.exclusions="**/obj/**,**/bin/**,**/Migrations/**"

    - name: Build
      run: dotnet build backend/backend.csproj --no-restore --configuration Release

    - name: End SonarCloud analysis
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"