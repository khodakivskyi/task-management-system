name: CI

on:  
  pull_request: 
    branches: [ master ]

jobs: 
  backend-ci:
    runs-on:  ubuntu-latest

    steps: 
    - uses: actions/checkout@v4
      with: 
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:  
        dotnet-version: 10.0.x

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with: 
        distribution: 'zulu'
        java-version: '17'

    - name: Cache SonarCloud packages
      uses: actions/cache@v4
      with: 
        path:  ~/.sonar/cache
        key:  ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Install SonarCloud scanner
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Restore dependencies
      run: dotnet restore backend/backend.sln

    - name: Format check
      run: dotnet format backend/backend.csproj --verify-no-changes

    - name: Begin SonarCloud analysis
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        cd backend
        dotnet-sonarscanner begin \
          /k:"khodakivskyi_task-management-system" \
          /o:"khodakivskyi" \
          /d:sonar.token="$SONAR_TOKEN" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /d:sonar.projectBaseDir=".." \
          /d:sonar.working.directory="../.sonarqube" \
          /d:sonar.exclusions="**/obj/**,**/bin/**,**/Migrations/**,**/*.Tests/**,**/Properties/**" \
          /d:sonar.cs.opencover.reportsPaths="../coverage-reports/coverage.xml" \
          /d:sonar.coverage.exclusions="**/*.Tests/**,**/Migrations/**,**/Program.cs,**/Models/**"

    - name: Build
      run: dotnet build backend/backend.sln --no-restore --configuration Release

    - name: Test with Coverage
      run:  |
        dotnet test backend/backend.sln \
          --no-build \
          --configuration Release \
          --verbosity normal \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults \
          --settings backend/coverlet.runsettings

    - name: Debug - List all generated files
      run: |
        echo "=== TestResults structure ==="
        ls -R ./TestResults || echo "TestResults not found"
        echo "=== Looking for coverage files ==="
        find . -type f -name "*.xml" | grep -i coverage || echo "No coverage files found"

    - name: Move coverage to predictable location
      run: |
        mkdir -p ./coverage-reports
        find ./TestResults -type f -name "coverage.opencover.xml" -exec cp {} ./coverage-reports/coverage.xml \;
        echo "=== Coverage file ==="
        ls -la ./coverage-reports/
        cat ./coverage-reports/coverage.xml | head -20 || echo "No coverage file"

    - name: End SonarCloud analysis
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        cd backend
        dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"