name: CI

on:   
  push:
    branches: [ master ]
  pull_request: 
    branches: [ master ]

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_PATH: 'backend/backend.sln'

jobs:  
  backend-ci: 
    runs-on:  ubuntu-latest
    timeout-minutes: 10

    steps: 
    - uses: actions/checkout@v4
      with: 
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:  
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:   
        distribution: 'zulu'
        java-version: '17'

    - name: Cache SonarCloud packages
      uses: actions/cache@v4
      with: 
        path: ~/.sonar/cache
        key: ${{ runner.os }}-sonar
        restore-keys: ${{ runner.os }}-sonar

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/. nuget/packages
        key:  ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: ${{ runner. os }}-nuget-

    - name: Install SonarCloud scanner
      run: dotnet tool install --global dotnet-sonarscanner

    - name: Restore dependencies
      run: dotnet restore ${{ env. SOLUTION_PATH }}

    - name: Format check
      run: dotnet format ${{ env. SOLUTION_PATH }} --verify-no-changes --no-restore

    - name: Begin SonarCloud analysis
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        dotnet-sonarscanner begin \
          /k:"khodakivskyi_task-management-system" \
          /o:"khodakivskyi" \
          /d:sonar.token="$SONAR_TOKEN" \
          /d:sonar.host.url="https://sonarcloud.io" \
          /d:sonar.cs. opencover.reportsPaths="**/coverage.opencover.xml" \
          /d:sonar.exclusions="**/obj/**,**/bin/**,**/Migrations/**,**/backend. Tests/**" \
          /d:sonar.coverage.exclusions="**/backend.Tests/**,**/Migrations/**,**/Program.cs"

    - name: Build
      run: dotnet build ${{ env.SOLUTION_PATH }} --no-restore --configuration Release

    - name: Test with Coverage
      run:  |
        dotnet test ${{ env.SOLUTION_PATH }} \
          --no-build \
          --configuration Release \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults \
          --settings backend/coverlet.runsettings

    - name: End SonarCloud analysis
      env: 
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        ls -la ./coverage/ || echo "Coverage directory not found"
        dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"