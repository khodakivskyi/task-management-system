name: Tests and Coverage

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore backend/backend.sln
    
    - name: Build
      run: dotnet build backend/backend.sln --no-restore --configuration Release
    
    - name: Test with coverage
      run: dotnet test backend/backend.sln --no-build --verbosity normal --configuration Release --collect:"XPlat Code Coverage" --settings backend/coverlet.runsettings
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: always()
      with:
        files: '**/coverage.cobertura.xml'
        fail_ci_if_error: false
        verbose: true
